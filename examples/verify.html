<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>human cord — 公開検証(オフライン)</title>
<style>
  body { font-family: "Yu Gothic", "Meiryo", system-ui, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; line-height: 1.6; }
  h1 { font-size: 20px; border-bottom: 3px solid #2c3e50; padding-bottom: 6px; }
  .lead { color: #444; font-size: 14px; }
  .lead b { color: #1a1a1a; }
  label { display: block; font-weight: bold; margin: 14px 0 4px; font-size: 14px; }
  textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, "Consolas", monospace; font-size: 12px; padding: 8px; border: 1px solid #aaa; border-radius: 4px; }
  #pub { height: 90px; } #att { height: 150px; }
  .row { margin-top: 14px; }
  button { font-size: 14px; padding: 8px 16px; border-radius: 6px; border: 1px solid #2c3e50; background: #2c3e50; color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: #2c3e50; }
  #result { margin-top: 18px; padding: 14px; border-radius: 6px; font-size: 15px; display: none; }
  #result.ok { background: #e7f6ec; border: 1px solid #2e7d32; }
  #result.ng { background: #fdecea; border: 1px solid #c62828; }
  #result .verdict { font-weight: bold; font-size: 17px; }
  table { border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { border: 1px solid #bbb; padding: 4px 10px; text-align: left; }
  .note { color: #666; font-size: 12px; margin-top: 22px; border-top: 1px solid #ddd; padding-top: 10px; }
  code { background: #f2f2f2; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<h1>human cord — 公開検証(オフライン・サーバ不要)</h1>
<p class="lead">
  発行者の<b>公開鍵だけ</b>で、証明(attestation)の真贋を<b>この場で(オフラインで)</b>確認します。
  発行者の秘密は不要。このページはサーバと通信せず、ブラウザ内(Web Crypto / Ed25519)で完結します。
</p>

<label for="pub">発行者の公開鍵(PEM)</label>
<textarea id="pub" placeholder="-----BEGIN PUBLIC KEY-----&#10;...&#10;-----END PUBLIC KEY-----"></textarea>

<label for="att">証明(attestation JSON)</label>
<textarea id="att" placeholder='{ "facts": {...}, "docId": "...", "issuedAt": "...", "alg": "ed25519", "sig": "..." }'></textarea>

<div class="row">
  <button id="verify">検証する</button>
  <button id="example" class="ghost">実例を読み込む</button>
</div>

<div id="result"></div>

<p class="note">
  仕組み: 証明の <code>{facts, docId, issuedAt}</code> を正準化(キー順非依存)し、発行者公開鍵で Ed25519 署名を検証します。
  改ざん・別発行者なら不一致になります。<br>
  注: これは「公開してよい事実」を検証する層です。発行者だけが読む裏チャネル(暗号化本体)は別レイヤで、ここでは扱いません。
</p>

<script>
// ── pubkey.js と同一の正準化(キー順非依存)。バイト列を一致させるのが要。 ──
function stableStringify(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
  const keys = Object.keys(v).sort();
  return '{' + keys.map((k) => JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';
}
function canonical(att) {
  return new TextEncoder().encode(stableStringify({
    facts: att.facts, docId: att.docId ?? null, issuedAt: att.issuedAt ?? null,
  }));
}
function pemToDer(pem) {
  const b64 = pem.replace(/-----BEGIN [^-]+-----/, '').replace(/-----END [^-]+-----/, '').replace(/\s+/g, '');
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
}
function b64ToBytes(b64) { return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)); }

async function verifyAttestation(pubPem, att) {
  if (!att || att.alg !== 'ed25519' || typeof att.sig !== 'string') {
    return { ok: false, reason: '対応していない/壊れた証明です' };
  }
  let key;
  try {
    key = await crypto.subtle.importKey('spki', pemToDer(pubPem), { name: 'Ed25519' }, false, ['verify']);
  } catch (e) { return { ok: false, reason: '公開鍵の読み込みに失敗: ' + e.message }; }
  let ok;
  try {
    ok = await crypto.subtle.verify({ name: 'Ed25519' }, key, b64ToBytes(att.sig), canonical(att));
  } catch (e) { return { ok: false, reason: '検証中エラー: ' + e.message }; }
  return ok ? { ok: true, facts: att.facts, docId: att.docId } : { ok: false, reason: '署名が一致しません(改ざん or 別発行者)' };
}

// 安全に描画(facts は検証成功時=発行者署名済みだが、検証ツールとして textContent で防御的に)。
function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (text != null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}
function render(r) {
  const box = document.getElementById('result');
  box.textContent = '';
  box.style.display = 'block';
  box.className = r.ok ? 'ok' : 'ng';
  box.dataset.verdict = r.ok ? 'valid' : 'invalid'; // headless テスト用
  if (r.ok) {
    box.appendChild(el('div', '✓ 正規発行・改ざんなし', 'verdict'));
    const table = document.createElement('table');
    for (const [k, v] of Object.entries(r.facts || {})) {
      const tr = document.createElement('tr');
      tr.appendChild(el('th', k));
      tr.appendChild(el('td', String(v)));
      table.appendChild(tr);
    }
    box.appendChild(table);
  } else {
    box.appendChild(el('div', '✗ 検証できません', 'verdict'));
    box.appendChild(el('div', r.reason || ''));
  }
}

async function runFromInputs() {
  const pub = document.getElementById('pub').value.trim();
  let att;
  try { att = JSON.parse(document.getElementById('att').value); }
  catch { return render({ ok: false, reason: '証明 JSON の形式が不正です' }); }
  render(await verifyAttestation(pub, att));
}

// ── 実例(発行者がオフラインで生成。公開鍵だけ埋め込み。秘密鍵は不要・非掲載)──
const EXAMPLE_PUB = `-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEAsI81d/oPYhp6bv2uzf4kAk9o+mPOYp6rhtP4E8kRUn4=
-----END PUBLIC KEY-----`;
const EXAMPLE_ATT = {
  "facts": { "docId": "CASE-2026-0042", "kind": 4, "devices": 12, "method": "Blancco", "site": "LOG", "date": "2026-05-30" },
  "docId": "CASE-2026-0042",
  "issuedAt": "2026-05-30",
  "alg": "ed25519",
  "sig": "pNXGTjPTBx+AKduHrT3atm1IlFrbvFh84Eb1jRtVAT/Ta13sKaWVTP19vFH57PuDvIMn9T1lwqf7vNp/ezZHCA=="
};
function loadExample() {
  document.getElementById('pub').value = EXAMPLE_PUB;
  document.getElementById('att').value = JSON.stringify(EXAMPLE_ATT, null, 2);
}

document.getElementById('verify').addEventListener('click', runFromInputs);
document.getElementById('example').addEventListener('click', loadExample);

// headless 自己テスト: ?autotest=valid / ?autotest=tamper
(async () => {
  const mode = new URLSearchParams(location.search).get('autotest');
  if (!mode) return;
  const att = JSON.parse(JSON.stringify(EXAMPLE_ATT));
  if (mode === 'tamper') att.facts.devices = 9999;
  render(await verifyAttestation(EXAMPLE_PUB, att));
})();
</script>
</body>
</html>
